version: "3.9"
services:
  rag-persona:
    build: .
    image: rag_persona:latest
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Optional keys
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JINA_API_KEY=${JINA_API_KEY}
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    working_dir: /app/data/persona_set
    command: ["python", "../../main.py", "--help"]

